name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --external-sources --source-path=scripts scripts/*.sh
      - name: PHP syntax
        run: |
          set -euo pipefail
          for file in scripts/*.php; do php -l "$file"; done
