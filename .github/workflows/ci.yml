name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests on the Node that the runner provides
        run: node --version && npm test
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests on Node 24
        run: npm test
      - name: Syntax of the PHP helpers
        run: |
          set -euo pipefail
          for file in src/php/*.php; do php -l "$file"; done
